[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle"
description = "PERSONAL OPSEC INTELLIGENCE ENGINE"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["opsec", "security", "privacy", "osint", "intelligence"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dynamic = ["version"]

dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "rich>=13.7",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "mypy>=1.11",
]
gui = [
    "customtkinter>=5.2",
]

[project.scripts]
oracle = "oracle.cli.main:cli"

[project.urls]
Documentation = "https://github.com/shwdaniel7/ORACLE"

[tool.setuptools.dynamic]
version = { attr = "oracle.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["oracle*"]

[tool.pytest.ini_options]
testpaths = ["oracle/tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["tomllib", "tomli"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["customtkinter"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["oracle.tests.*"]
ignore_errors = true